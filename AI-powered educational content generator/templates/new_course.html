{% extends "base.html" %}
{% block header_title %}New Course{% endblock %}
{% block title %}New Course | AI-powered educational content generator{% endblock %}
{% block content %}
<section class="card">
  <h2>Course Details</h2>
  <form method="POST" action="{{ url_for('generate') }}" class="grid">
    <label>Course Topic
      <input type="text" name="topic" placeholder="e.g., Introduction to Machine Learning" required>
    </label>

    <label>Academic Level
      <select name="academic_level" required>
        <option value="First year university student">First year university student</option>
        <option value="Second year university student">Second year university student</option>
        <option value="Third year university student">Third year university student</option>
        <option value="Last year university student">Last year university student</option>
      </select>
    </label>

    <label>Language
      <select name="language" required>
        <option value="English">English</option>
        <option value="Arabic">Arabic</option>
      </select>
    </label>

    <label>Course Duration (minutes)
      <input type="number" name="duration_minutes" min="30" max="240" value="90" required>
    </label>

    <label>Number of Chapters
      <input type="number" name="num_chapters" min="1" max="12" value="6" required>
    </label>

    <div class="actions">
      <button class="btn" type="submit">Generate</button>
    </div>
  </form>
</section>
{% endblock %}
